<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - WorkBuddy2API 控制台</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151c2e;
            --border: #232f48;
            --primary: #3b82f6;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            justify-content: center;
        }
        .logo-icon {
            font-size: 2.5rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.875rem;
            margin-top: 0.25rem;
            margin-bottom: 2rem;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--muted);
        }
        input {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--primary);
        }
        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .error {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-wrap">
            <span class="logo-icon">⚡</span>
            <div>
                <h1>WorkBuddy2API</h1>
                <p class="subtitle">全功能运维控制台</p>
            </div>
        </div>
        <div class="input-group">
            <label for="adminKey">管理访问口令 (Admin Key)</label>
            <input type="password" id="adminKey" placeholder="请输入管理口令..." autofocus>
        </div>
        <button onclick="login()">进入控制台</button>
        <div id="errMsg" class="error"></div>
    </div>
    <script>
        document.getElementById('adminKey').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
        async function login() {
            const key = document.getElementById('adminKey').value.trim();
            const err = document.getElementById('errMsg');
            if (!key) return;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({key})
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    location.href = '/';
                } else {
                    err.textContent = data.error || '登录失败';
                    err.style.display = 'block';
                }
            } catch (e) {
                err.textContent = '网络错误';
                err.style.display = 'block';
            }
        }
    </script>
</body>
</html>
